name: MVPlayer
options:
  bundleIdPrefix: me.limboy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_SWIFT_FLAGS:
      - "-Xcc"
      - "-DGL_SILENCE_DEPRECATION"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  CMPVShim:
    type: framework
    platform: macOS
    sources:
      - path: CMPVShim
        excludes:
          - include
    headers:
      public:
        - CMPVShim/CMPVShim.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.mvplayer.CMPVShim
        PRODUCT_MODULE_NAME: CMPVShim
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/CMPVShim"
  MVPlayer:
    type: application
    platform: macOS
    sources:
      - MVPlayer
      - path: Assets/mvplayer.icon
        buildPhase: resources
    dependencies:
      - target: CMPVShim
      - package: Sparkle
    info:
      path: MVPlayer/Support/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUFeedURL: https://github.com/limboy/mvplayer/releases/latest/download/appcast.xml
        SUPublicEDKey: B6+JHJ8tGYlOk0bFN5Ldnn+U40ebdkWsqWYg9nZMh0A=
        # Lets the Finder hand video files to MVPlayer, through Open With or by
        # dropping them on the icon. The rank is Alternate deliberately: the app
        # offers to open these, it does not claim them from whatever the Mac
        # already opens them with.
        #
        # The first entry covers everything the system knows is video. The
        # second lists the containers it has no type for and only mpv can read,
        # and is kept in step with FolderLibrary.videoExtensions.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audiovisual-content
          - CFBundleTypeName: Video File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - 3g2
              - 3gp
              - asf
              - avi
              - divx
              - dv
              - f4v
              - flv
              - m2t
              - m2ts
              - m4v
              - mkv
              - mov
              - mp4
              - mpeg
              - mpg
              - mts
              - ogm
              - ogv
              - rm
              - rmvb
              - ts
              - vob
              - webm
              - wmv
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: mvplayer
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.mvplayer
        PRODUCT_NAME: MVPlayer
        PRODUCT_MODULE_NAME: MVPlayer
        MARKETING_VERSION: "0.2.5"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MVPlayer
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: MVPlayer/Support/MVPlayer.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ldl"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
    postbuildScripts:
      - name: Embed mpv runtime
        path: scripts/embed-mpv-runtime.sh
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - MVPlayerTests
  MVPlayerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MVPlayerTests
    dependencies:
      - target: MVPlayer
      - target: CMPVShim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.mvplayer.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MVPlayer.app/Contents/MacOS/MVPlayer"
        BUNDLE_LOADER: "$(TEST_HOST)"
